name: Publish Actions Runner Image

on:
  push:
    paths:
      - "actions-runner/**"
      - ".github/workflows/publish-actions-runner-image.yml"
    branches:
      - master
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/actions-runner

# Serialise runs so the scheduled and push-triggered builds can't race on the
# shared :staging candidate tag.
concurrency:
  group: publish-actions-runner-image
  cancel-in-progress: false

permissions: {}

jobs:
  build-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      packages: write # push the image to GHCR and read its tags
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the provenance attestation
    outputs:
      published: ${{ steps.promote.outcome == 'success' }}
      tag: ${{ steps.fetch_release.outputs.upstream_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU #emulation support with QEMU to be able to build against more platforms.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # gh api authenticates with GITHUB_TOKEN (no shared per-IP rate limit) and
      # exits non-zero on HTTP errors, so it is never piped. The regex guard
      # fails the job instead of building a bogus tag such as `null`.
      - name: Fetch latest release from upstream
        id: fetch_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_release=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
          echo "Latest upstream release: $latest_release"
          [[ "$latest_release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "upstream_release=$latest_release" >> "$GITHUB_OUTPUT"
      - name: Get the latest release from our repository
        id: get_current_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api /orgs/skyscrapers/packages/container/actions-runner/versions --jq '.[0].metadata.container.tags[]')
          latest_tag=$(echo "$tags" | grep -v latest | sort -rV | head -n 1)
          echo "Current release: $latest_tag"
          echo "current_release=$latest_tag" >> "$GITHUB_OUTPUT"
      - name: Compare releases
        id: compare_releases
        env:
          UPSTREAM_RELEASE: ${{ steps.fetch_release.outputs.upstream_release }}
          CURRENT_RELEASE: ${{ steps.get_current_release.outputs.current_release }}
        run: |
          if [ "$UPSTREAM_RELEASE" != "$CURRENT_RELEASE" ]; then
            echo "New release found: $UPSTREAM_RELEASE"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new release found"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi
      # Push a verification candidate first; it is promoted to the release tags
      # only after every platform is confirmed runnable (see below). Runners
      # consume :latest / the version tag, never :staging.
      - name: Build and push the verification candidate
        id: build
        if: steps.compare_releases.outputs.new_release == 'true'  || github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: actions-runner/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          push: true
          provenance: false

      # Guards against skyscrapers/platform#1965: a manifest entry held content
      # for the wrong architecture (our runners are amd64, and the broken publish
      # left arm64 binaries under the amd64 entry), so they died with "exec format
      # error". Both checks below are independent of this job's own arch and of
      # QEMU: dpkg's reported architecture must match the platform Docker was told
      # to run, and the ELF e_machine byte (offset 18: 62=x86-64, 183=aarch64) of
      # the entrypoint interpreter and the downloaded CLIs must match it too.
      - name: Verify each platform before promoting
        if: steps.compare_releases.outputs.new_release == 'true'  || github.event_name == 'push'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "${arch}" in
              amd64) want_em=62 ;;
              arm64) want_em=183 ;;
            esac
            echo "::group::Verifying linux/${arch}"
            docker run --rm --platform "linux/${arch}" \
              -e EXPECTED_ARCH="${arch}" -e WANT_EM="${want_em}" "${IMAGE}" bash -c '
                set -eu
                got_arch="$(dpkg --print-architecture)"
                echo "dpkg architecture: expected=${EXPECTED_ARCH} got=${got_arch}"
                test "${got_arch}" = "${EXPECTED_ARCH}"
                for bin in /bin/bash /usr/bin/kubectl "$(readlink -f "$(command -v aws)")"; do
                  em="$(od -An -tu1 -j18 -N1 "${bin}" | tr -d " ")"
                  echo "  ${bin}: e_machine=${em} (want ${WANT_EM})"
                  test "${em}" = "${WANT_EM}"
                done
              '
            echo "::endgroup::"
          done

      # Re-tag the verified manifest list (no rebuild) to the tags runners use.
      - name: Promote verified image to release tags
        id: promote
        if: steps.compare_releases.outputs.new_release == 'true'  || github.event_name == 'push'
        env:
          UPSTREAM_RELEASE: ${{ steps.fetch_release.outputs.upstream_release }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${UPSTREAM_RELEASE}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging"

      # Signed (Sigstore) provenance, kept in GitHub's attestation store rather than
      # in the image index, so the index digest is the same as without it. Verify
      # with `gh attestation verify oci://<image>@<digest> -R skyscrapers/docker-images`.
      # imagetools create copies the verified index as-is, so the build digest is
      # the one behind the release tags.
      - name: Attest build provenance
        if: steps.promote.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  # Runs in its own job so the webhook secret never shares a runner with the
  # build. The `slack` environment only releases it to master.
  notify:
    needs: build-latest
    if: always() && (needs.build-latest.result == 'failure' || needs.build-latest.outputs.published == 'true')
    runs-on: ubuntu-latest
    environment: slack
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: >-
            ${{ needs.build-latest.result == 'success' && ':white_check_mark: Published' || ':x: Failed to build' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-latest.outputs.tag || 'latest' }}
            (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>)
        run: |
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
