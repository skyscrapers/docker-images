name: Publish EIP-assigner Image

on:
  push:
    paths:
      - "eip-assigner/**"
      - ".github/workflows/publish-eip-assigner-image.yml"
    branches:
      - master
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/eip-assigner

permissions: {}

jobs:
  build-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      packages: write # push the image to GHCR and read its tags
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU #emulation support with QEMU to be able to build against more platforms.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the container to GitHub Container Registry using the latest tag
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: eip-assigner/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          push: true
          provenance: false
      # Signed (Sigstore) provenance, kept in GitHub's attestation store rather than
      # in the image index, so the index digest is the same as without it. Verify
      # with `gh attestation verify oci://<image>@<digest> -R skyscrapers/docker-images`.
      - name: Attest build provenance
        if: steps.build.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

  # Runs in its own job so the webhook secret never shares a runner with the
  # build. The `slack` environment only releases it to master. This image
  # rebuilds every night, so only failures are worth a message.
  notify:
    needs: build-latest
    if: failure()
    runs-on: ubuntu-latest
    environment: slack
    permissions: {}
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: >-
            :x: Failed to build
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run>)
        run: |
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
